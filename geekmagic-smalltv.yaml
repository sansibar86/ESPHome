substitutions:
  device_name: geekmagic-smalltv
  friendly_sensor_name: geekmagic_smalltv

esphome:
  name: ${device_name}
  friendly_name: geekmagic-smalltv
  min_version: 2024.11.0
  name_add_mac_suffix: false

esp8266:
  board: esp01_1m

external_components:
  - source:
      type: git
      url: https://github.com/rletendu/esphome.git
      ref: st7789_nobuffer_202312
    components: [st7789v]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  manual_ip: 
    static_ip: !secret geekmagic-smalltv_manual_ip_static_ip
    subnet: !secret subnet
    gateway: !secret gateway

  ap:
    ssid: !secret geekmagic-smalltv_ap_ssid
    password: !secret geekmagic-smalltv_ap_password

logger:
  level: NONE

api:
  encryption:
    key: !secret geekmagic-smalltv_api_encryption_key

ota:
  - platform: esphome
    password: !secret geekmagic-smalltv_ota_esphome_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time
    timezone: "Europe/Berlin"

# =========================
# Animation Frame
# =========================

globals:
  - id: weather_frame
    type: int
    restore_value: no
    initial_value: '0'

interval:
  - interval: 600ms
    then:
      - lambda: |-
          id(weather_frame)++;
          if (id(weather_frame) > 1)
            id(weather_frame) = 0;

# =========================
# Home Assistant Sensoren
# =========================

sensor:
  - platform: homeassistant
    id: outdoor_temp
    entity_id: sensor.outdoor_temperature

  - platform: homeassistant
    id: indoor_temp
    entity_id: sensor.schlafen_ist_temperatur

  - platform: homeassistant
    id: indoor_humidity
    entity_id: sensor.schlafen_luftfeuchtigkeit

text_sensor:
  - platform: homeassistant
    id: weather
    entity_id: weather.home

  - platform: homeassistant
    id: alarm_enabled
    entity_id: input_boolean.alarmanlage_status

# =========================
# SPI Display
# =========================

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  interface: hardware
  id: spihwd

output:
  - platform: esp8266_pwm
    pin: GPIO05
    frequency: 40 Hz
    id: pwm_output
    inverted: true

light:
  - platform: monochromatic
    output: pwm_output
    name: "Backlight"
    id: back_light
    restore_mode: RESTORE_DEFAULT_ON

display:
  - platform: st7789v
    model: "Custom"
    spi_id: spihwd
    height: 240
    width: 240
    offset_height: 0
    offset_width: 0
    dc_pin: GPIO00
    reset_pin: GPIO02
    eightbitcolor: True
    update_interval: 60s
    id: disp
    spi_mode: mode3
    lambda: |-

      auto now = id(ha_time).now();
      bool night = false;

      if (now.is_valid()) {
        if (now.hour >= 22 || now.hour < 7)
          night = true;
      }

      // Hintergrund
      it.fill(Color::BLACK);

      // Farben je Modus
      Color col_time = night ? Color(0, 120, 120) : Color(0, 255, 200);
      Color col_data = night ? Color(0, 150, 150) : Color(0, 255, 255);
      Color col_room = night ? Color(0, 120, 0) : Color(0, 255, 0);

      // =====================
      // Uhrzeit (größte Anzeige)
      // =====================
      if (now.is_valid()) {
        char time_str[5];
        sprintf(time_str, "%d:%02d", now.hour, now.minute);
        it.printf(120, 20, id(font_time), col_time,
                  TextAlign::TOP_CENTER, "%s", time_str);
      }

      // =====================
      // OUTSIDE
      // =====================
      it.printf(10, 90, id(font_label),
                night ? Color(120, 0, 120) : Color(255, 0, 255), "OUT");

      it.printf(10, 115, id(font_data), col_data,
                "%.1f°", id(outdoor_temp).state);

      if (id(weather).state == "rainy" && id(outdoor_temp).state > 2) {
        it.image(80, 100,
          id(weather_frame) == 0 ? id(rain_0) : id(rain_1));
      }
      else if (id(weather).state == "rainy") {
        it.image(80, 100,
          id(weather_frame) == 0 ? id(snow_0) : id(snow_1));
      }
      else if (id(weather).state == "sunny") {
        it.image(80, 100, id(icon_sun));
      }
      else if (id(weather).state == "cloudy") {
        it.image(80, 100, id(icon_cloud));
      }
      else {
        it.image(80, 100, id(icon_moon));
      }

      // =====================
      // ROOM
      // =====================
      it.printf(140, 90, id(font_label), col_room, "ROOM");

      it.printf(140, 115, id(font_data), col_room,
                "%.1f°", id(indoor_temp).state);

      it.printf(140, 145, id(font_data_small), col_room,
                "%.0f%%", id(indoor_humidity).state);

      // =====================
      // Alarm
      // =====================
      if (id(alarm_enabled).state == "on") {
        it.image(5, 170, id(icon_lock));
        it.printf(60, 188, id(font_label),
                  night ? Color(120, 0, 0) : Color(255, 0, 0),
                  "ARMED");
      } else {
        it.image(5, 170, id(icon_lock));
        it.printf(60, 188, id(font_label),
                  night ? Color(0, 120, 0) : Color(0, 255, 0),
                  "DISARMED");
      }

      // =====================
      // CRT Scanlines (nur Day Mode)
      // =====================
      if (!night) {
        for (int y = 0; y < 240; y += 4)
          it.line(0, y, 240, y, Color(0, 20, 20));
      }

# =========================
# Fonts (ESP8266 optimiert)
# =========================

font:
  - file: "fonts/orbitron-bold.otf"
    id: font_time
    size: 44
    glyphs: "0123456789:"

  - file: "fonts/orbitron-medium.otf"
    id: font_data
    size: 22
    glyphs: "0123456789.-%°"

  - file: "fonts/orbitron-medium.otf"
    id: font_data_small
    size: 18
    glyphs: "0123456789%."

  - file: "fonts/orbitron-medium.otf"
    id: font_label
    size: 16
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZ "

# =========================
# Icons
# =========================

image:
  - file: "icons/icons8-rain-48.png"
    type: binary
    id: rain_0
  - file: "icons/icons8-rain-48.png"
    id: rain_1
    type: binary
  - file: "icons/icons8-snow-48.png"
    id: snow_0
    type: binary
  - file: "icons/icons8-snow-48.png"
    id: snow_1
    type: binary
  - file: "icons/icons8-sun-48.png"
    type: binary
    id: icon_sun
  - file: "icons/icons8-cloud-48.png"
    type: binary
    id: icon_cloud
  - file: "icons/icons8-moon-and-stars-48.png"
    type: binary
    id: icon_moon
  - file: "icons/icons8-security-lock-48.png"
    type: binary
    id: icon_lock
